name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: QianxiSchedule-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # Tag builds sign and publish by default. Set the repository variable
    # SIGNED_RELEASE_ENABLED to 'false' to deliberately skip publishing.
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNED_RELEASE_ENABLED != 'false'
    needs: verify
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty: the signing key secret is not configured." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build signed release APK
        run: ./gradlew assembleRelease
      - name: Publish GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=app/build/outputs/apk/release/app-release.apk
          RELEASE_APK="QianxiSchedule-${VERSION}.apk"
          mv "$APK" "$RELEASE_APK"
          SOURCE_ZIP="QianxiSchedule-${VERSION}-source.zip"
          git archive --format=zip --prefix="QianxiSchedule-${VERSION}/" -o "$SOURCE_ZIP" HEAD
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "潜溪课表 ${VERSION}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$RELEASE_APK" "$SOURCE_ZIP" USAGE.md --clobber
